services:
  - type: web
    name: fake-guard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTO_VERIFY
        value: "false"
      - key: MONGO_URI
        sync: false
      - key: BASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
